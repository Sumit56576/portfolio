<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE5D0"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#471506" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Geometric Frame Accent -->
  <rect x="25" y="25" width="350" height="430" fill="none" stroke="#471506" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Technical corner crosshairs -->
  <path d="M 15 25 L 35 25 M 25 15 L 25 35" stroke="#471506" stroke-width="2"/>
  <path d="M 365 25 L 385 25 M 375 15 L 375 35" stroke="#471506" stroke-width="2"/>
  <path d="M 15 455 L 35 455 M 25 445 L 25 465" stroke="#471506" stroke-width="2"/>
  <path d="M 365 455 L 385 455 M 375 445 L 375 465" stroke="#471506" stroke-width="2"/>

  <!-- Center Badge Circle -->
  <circle cx="200" cy="200" r="100" fill="#FFFCF9" stroke="#471506" stroke-width="3"/>
  <circle cx="200" cy="200" r="92" fill="none" stroke="#904d00" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Monogram Initials -->
  <text x="200" y="215" font-family="'Syne', sans-serif" font-size="76" font-weight="800" fill="#471506" text-anchor="middle" letter-spacing="-2">SP</text>

  <!-- Developer Brackets & Subtitle -->
  <text x="200" y="260" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#904d00" text-anchor="middle" letter-spacing="3">&lt;BUILDER /&gt;</text>
  
  <!-- Minimalist Tech Card details below -->
  <rect x="50" y="330" width="300" height="75" fill="#471506" rx="4"/>
  <text x="200" y="358" font-family="'Syne', sans-serif" font-size="16" font-weight="700" fill="#F5F0E8" text-anchor="middle" letter-spacing="1">SUMIT PANDEY</text>
  <text x="200" y="382" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#fe932c" text-anchor="middle">Scaler School of Technology</text>
  
  <!-- Small Status Light -->
  <circle cx="68" cy="354" r="4" fill="#fe932c"/>
</svg>
